<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AETHER LINK</title><style>body{margin:0;background:#050a14;overflow:hidden}canvas{width:100%;height:100vh;display:block}</style></head><body><canvas id="c"></canvas><script>c=document.getElementById('c');x=c.getContext('2d');W=innerWidth;H=innerHeight;c.width=W;c.height=H;stars=[];for(i=0;i<15;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:4});function draw(){x.fillStyle='#050a14';x.fillRect(0,0,W,H);stars.forEach(s=>{x.beginPath();x.arc(s.x,s.y,s.r,0,6.28);x.fillStyle='#fff';x.fill()});requestAnimationFrame(draw)}draw();</script></body></html>
